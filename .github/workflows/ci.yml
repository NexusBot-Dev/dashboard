name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nexus_test
          MARIADB_USER: nexus_test
          MARIADB_PASSWORD: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npx astro check

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npm run test:e2e
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 3306

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
